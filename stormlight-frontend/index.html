<!doctype html>
<html lang="en" data-theme="blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stormlight-frontend</title>
    <style>
      html,body{background:linear-gradient(180deg,#081d47 0%,#0b2c78 100%) fixed;background-attachment:fixed;background-size:cover;min-height:100vh}
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('selectedTheme') || 'blue';
          document.documentElement.setAttribute('data-theme', t);
          document.body.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
